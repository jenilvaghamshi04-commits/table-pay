services:
  - type: web
    name: salon-desk
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: salon-data
      mountPath: /var/data
      sizeGB: 1
